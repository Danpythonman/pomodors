[package]
name = "pomodors"
version = "0.1.1"
edition = "2024"
description = "A shared, multi-user pomodoro timer for the terminal"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Danpythonman/pomodors"
readme = "README.md"
keywords = ["pomodoro", "timer", "tui", "productivity", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
if-addrs = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
